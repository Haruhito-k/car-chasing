
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>APEX RACING - 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:white;font-family:Arial,"Noto Sans JP",sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(8,14,21,.76);border:1px solid #ffffff24;border-radius:12px;padding:10px 14px;backdrop-filter:blur(5px)}
#topLeft{position:absolute;top:12px;left:12px}
.brand{font-size:11px;letter-spacing:3px;color:#ffcf55;font-weight:bold}
#lap{font-size:18px;font-weight:bold;margin-top:4px}
#topRight{position:absolute;top:12px;right:12px;text-align:right}
#speed{font-size:34px;font-weight:900;font-style:italic;line-height:1}
#unit{font-size:10px;color:#b6c7d5;letter-spacing:2px}
#map{width:112px;height:82px;display:block;margin-top:5px}
#bottom{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:end;white-space:nowrap}
.stat{text-align:center;min-width:64px}
.stat small{font-size:10px;color:#a9bdcb;display:block}
.stat strong{font-size:17px}
#message{position:absolute;top:26%;left:50%;transform:translateX(-50%);font-weight:bold;font-size:clamp(18px,4vw,30px);text-align:center;text-shadow:0 2px 8px #000;white-space:nowrap}
#controls{position:fixed;inset:0;pointer-events:none}
.pad{position:absolute;bottom:22px;display:flex;gap:12px;align-items:end;pointer-events:auto}
#steerPad{left:14px}
#pedalPad{right:14px;flex-direction:column;gap:8px}
.ctrl{width:67px;height:67px;border-radius:18px;border:1px solid #ffffff55;background:#101c2bd9;color:white;font-size:28px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl:active,.ctrl.active{background:#e9a928;color:#111}
.pedal{width:76px;height:53px;font-size:13px;border-radius:13px}
#gas{background:#176f55e8}
#brake{background:#8b2a38e8}
#startScreen{position:fixed;inset:0;background:linear-gradient(180deg,#09121bdc,#09121b98);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
#startCard{width:min(440px,100%);background:#101a26f2;border:1px solid #ffffff26;border-radius:22px;padding:25px;text-align:center;box-shadow:0 20px 70px #0008}
#startCard h1{font-size:clamp(29px,8vw,45px);font-style:italic;margin:5px 0;color:#ffcc4d}
#startCard p{font-size:13px;color:#c2d0db;line-height:1.9}
#startBtn{width:100%;padding:16px;border:0;border-radius:12px;background:#ffca43;color:#111;font-size:17px;font-weight:900;margin-top:12px}
#startBtn:active{transform:scale(.98)}
#hint{font-size:11px!important;color:#8298a9!important}
#sensorStatus{color:#ffcf55}
#resetBtn{position:absolute;right:12px;bottom:115px;pointer-events:auto;border:1px solid #ffffff44;background:#101820dd;color:white;border-radius:9px;padding:9px 12px;font-size:12px}
@media(orientation:portrait){
 #bottom{bottom:105px}
 #steerPad{bottom:15px}
 #pedalPad{bottom:15px}
 #resetBtn{bottom:190px}
 #map{width:82px;height:60px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div id="topLeft" class="panel">
    <div class="brand">APEX RACING</div>
    <div id="lap">LAP 1 / 3</div>
    <div style="font-size:11px;color:#b6c7d5;margin-top:4px">BEST <span id="best">--:--.---</span></div>
  </div>

  <div id="topRight" class="panel">
    <div id="speed">000</div>
    <div id="unit">KM / H</div>
    <canvas id="map" width="224" height="164"></canvas>
  </div>

  <div id="message">READY</div>

  <div id="bottom" class="panel">
    <div class="stat"><small>TIME</small><strong id="time">00:00.000</strong></div>
    <div class="stat"><small>POSITION</small><strong id="position">1 / 1</strong></div>
    <div class="stat"><small>ENGINE</small><strong id="engine">READY</strong></div>
  </div>
</div>

<div id="controls">
  <div class="pad" id="steerPad">
    <button class="ctrl" id="left" aria-label="左">◀</button>
    <button class="ctrl" id="right" aria-label="右">▶</button>
  </div>
  <div class="pad" id="pedalPad">
    <button class="ctrl pedal" id="gas">▲ ACCEL</button>
    <button class="ctrl pedal" id="brake">▼ BRAKE</button>
  </div>
  <button id="resetBtn">車をリセット</button>
</div>

<div id="startScreen">
  <div id="startCard">
    <div class="brand">NEXT GENERATION RACING</div>
    <h1>APEX RACING</h1>
    <p>
      本格サーキットを走り抜けろ。<br>
      3周のレースでベストタイムを目指そう。
    </p>
    <p>
      <b>左右に傾ける</b>：ハンドル<br>
      <b>前に傾ける</b>：アクセル<br>
      <b>手前に傾ける</b>：ブレーキ<br>
      画面のボタンでも操作できるよ。
    </p>
    <p id="sensorStatus">センサーの使用許可はスタート時に確認します。</p>
    <button id="startBtn">START RACE</button>
    <p id="hint">スマホを横向きにすると、より遊びやすくなります。</p>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;

let scene,camera,renderer,car,carBody,frontWheels=[],rearWheels=[];
let roadCurve,roadLength=0;
let running=false,finished=false;
let speed=0,steer=0,lateral=0,progress=0;
let lap=1,totalLaps=3,lapStart=0,raceStart=0;
let lastTime=performance.now(),elapsed=0,bestLap=null;
let lastLapProgress=0,lapTimes=[];
let baseBeta=null,baseGamma=null;
let pitchControl=0,tiltSteer=0;
let gasButton=false,brakeButton=false,leftButton=false,rightButton=false;
let sensorEnabled=false,offRoad=false;
let cameraTarget=new THREE.Vector3();
let carPosition=new THREE.Vector3();
let tangent=new THREE.Vector3();
let sideVector=new THREE.Vector3();
let tempVec=new THREE.Vector3();
let prevDistance=0;
const MAX_SPEED=245;
const ROAD_WIDTH=17;
const SAMPLES=500;

init();
animate();

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x9bbbd1);
  scene.fog=new THREE.Fog(0x9bbbd1,150,650);

  camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,1200);
  camera.position.set(0,7,-13);

  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;
  $('game').appendChild(renderer.domElement);

  const hemi=new THREE.HemisphereLight(0xe7f4ff,0x496044,2.0);
  scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xfff1d2,3.0);
  sun.position.set(-120,180,80);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-180;
  sun.shadow.camera.right=180;
  sun.shadow.camera.top=180;
  sun.shadow.camera.bottom=-180;
  sun.shadow.bias=-.0003;
  scene.add(sun);

  createEnvironment();
  createTrack();
  createCar();
  drawMap();

  window.addEventListener('resize',onResize);
  bindButton('left',v=>leftButton=v);
  bindButton('right',v=>rightButton=v);
  bindButton('gas',v=>gasButton=v);
  bindButton('brake',v=>brakeButton=v);
  $('resetBtn').addEventListener('click',resetCar);
  $('startBtn').addEventListener('click',startRace);
}

function material(color,roughness=0.85,metalness=0){
  return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function createEnvironment(){
  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(1600,1600),
    material(0x3e7041)
  );
  ground.rotation.x=-Math.PI/2;
  ground.position.y=-.25;
  ground.receiveShadow=true;
  scene.add(ground);

  // Distant low hills
  const hillMat=material(0x718b70);
  for(let i=0;i<36;i++){
    const a=i/36*Math.PI*2;
    const r=360+(i%5)*23;
    const h=30+(i%7)*8;
    const hill=new THREE.Mesh(
      new THREE.SphereGeometry(1,12,8),
      hillMat
    );
    hill.scale.set(45+(i%4)*15,h,55+(i%3)*18);
    hill.position.set(Math.cos(a)*r,h*.4,Math.sin(a)*r);
    scene.add(hill);
  }

  // Small trees beyond the circuit
  const trunkMat=material(0x5a3821);
  const leafMat=material(0x31563a);
  for(let i=0;i<150;i++){
    const a=Math.random()*Math.PI*2;
    const r=145+Math.random()*180;
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.4,3,6),trunkMat);
    trunk.position.set(x,1.2,z);
    const leaves=new THREE.Mesh(new THREE.ConeGeometry(2.2,6,7),leafMat);
    leaves.position.set(x,5,z);
    scene.add(trunk,leaves);
  }

  // Grandstands placed outside selected track sections
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+.25;
    const x=Math.cos(a)*128,z=Math.sin(a)*94;
    const stand=new THREE.Group();
    const base=new THREE.Mesh(new THREE.BoxGeometry(27,5,10),material(0x687582));
    base.position.y=2.5;
    stand.add(base);
    for(let row=0;row<5;row++){
      const seats=new THREE.Mesh(
        new THREE.BoxGeometry(25-row*.6,.45,1.4),
        material(row%2?0x244b70:0xb83d37)
      );
      seats.position.set(0,4+row*.65,-3+row*1.1);
      stand.add(seats);
    }
    stand.position.set(x,0,z);
    stand.rotation.y=-a;
    scene.add(stand);
  }
}

function createTrack(){
  // Closed racing circuit with straights, broad bends and tighter corners.
  const points=[
    [0,0],[55,-3],[94,-17],[108,-42],[94,-68],
    [53,-82],[7,-79],[-36,-68],[-73,-47],
    [-95,-20],[-90,10],[-67,34],[-35,47],
    [3,50],[36,36],[48,16],[37,2]
  ].map(([x,z])=>new THREE.Vector3(x,0,z));

  roadCurve=new THREE.CatmullRomCurve3(points,true,'catmullrom',.15);
  roadLength=roadCurve.getLength();

  const roadMat=material(0x34383d,.96);
  const lineMat=new THREE.MeshStandardMaterial({color:0xf5f2e8,roughness:.8});
  const redMat=material(0xd63a32);
  const whiteMat=material(0xf4f1e9);
  const railMat=material(0xa8b2bb,.5,.55);
  const darkMat=material(0x626970,.6,.3);

  const roadGeo=new THREE.BufferGeometry();
  const verts=[],uvs=[],indices=[];
  for(let i=0;i<=SAMPLES;i++){
    const t=i/SAMPLES;
    const p=roadCurve.getPointAt(t);
    const tan=roadCurve.getTangentAt(t).normalize();
    const side=new THREE.Vector3(-tan.z,0,tan.x);
    for(const w of [-ROAD_WIDTH/2,ROAD_WIDTH/2]){
      verts.push(p.x+side.x*w,.015,p.z+side.z*w);
      uvs.push((w+ROAD_WIDTH/2)/ROAD_WIDTH,t*roadLength/8);
    }
    if(i<SAMPLES){
      const k=i*2;
      indices.push(k,k+1,k+2,k+1,k+3,k+2);
    }
  }
  roadGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  roadGeo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  roadGeo.setIndex(indices);
  roadGeo.computeVertexNormals();
  const road=new THREE.Mesh(roadGeo,roadMat);
  road.receiveShadow=true;
  scene.add(road);

  // Edge stripes and dashed centre line
  for(let i=0;i<SAMPLES;i++){
    const t=i/SAMPLES;
    const p=roadCurve.getPointAt(t);
    const tan=roadCurve.getTangentAt(t).normalize();
    const side=new THREE.Vector3(-tan.z,0,tan.x);
    for(const s of [-1,1]){
      const stripe=new THREE.Mesh(
        new THREE.BoxGeometry(.23,.035,.8),
        lineMat
      );
      stripe.position.set(p.x+side.x*(ROAD_WIDTH/2-.4)*s,.06,p.z+side.z*(ROAD_WIDTH/2-.4)*s);
      stripe.rotation.y=Math.atan2(tan.x,tan.z);
      scene.add(stripe);
    }
    if(i%5<2){
      const dash=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,1.3),lineMat);
      dash.position.set(p.x,.055,p.z);
      dash.rotation.y=Math.atan2(tan.x,tan.z);
      scene.add(dash);
    }
  }

  // Alternating red/white curbs
  for(let i=0;i<SAMPLES;i++){
    const t=i/SAMPLES;
    const p=roadCurve.getPointAt(t);
    const tan=roadCurve.getTangentAt(t).normalize();
    const side=new THREE.Vector3(-tan.z,0,tan.x);
    for(const s of [-1,1]){
      const curb=new THREE.Mesh(
        new THREE.BoxGeometry(1.0,.16,1.0),
        (Math.floor(i/3)%2===0)?redMat:whiteMat
      );
      curb.position.set(p.x+side.x*(ROAD_WIDTH/2+.55)*s,.08,p.z+side.z*(ROAD_WIDTH/2+.55)*s);
      curb.rotation.y=Math.atan2(tan.x,tan.z);
      scene.add(curb);
    }
  }

  // Metallic guardrails on both sides, split into short sections
  for(let i=0;i<SAMPLES;i+=2){
    const t=i/SAMPLES;
    const p=roadCurve.getPointAt(t);
    const tan=roadCurve.getTangentAt(t).normalize();
    const side=new THREE.Vector3(-tan.z,0,tan.x);
    const yaw=Math.atan2(tan.x,tan.z);
    for(const s of [-1,1]){
      const rail=new THREE.Mesh(
        new THREE.BoxGeometry(.28,.65,roadLength/SAMPLES*2+.15),
        railMat
      );
      rail.position.set(p.x+side.x*(ROAD_WIDTH/2+2)*s,.8,p.z+side.z*(ROAD_WIDTH/2+2)*s);
      rail.rotation.y=yaw;
      rail.castShadow=true;
      scene.add(rail);

      const post=new THREE.Mesh(new THREE.BoxGeometry(.3,1.1,.3),darkMat);
      post.position.set(p.x+side.x*(ROAD_WIDTH/2+2)*s,.55,p.z+side.z*(ROAD_WIDTH/2+2)*s);
      scene.add(post);
    }
  }

  // Start / finish line across the asphalt
  const start=roadCurve.getPointAt(0);
  const tan=roadCurve.getTangentAt(0).normalize();
  for(let i=0;i<18;i++){
    const tile=new THREE.Mesh(
      new THREE.BoxGeometry(ROAD_WIDTH/18,.035,1.4),
      i%2?whiteMat:material(0x17191b)
    );
    tile.position.set(start.x+(i-8.5)*ROAD_WIDTH/18,.075,start.z);
    tile.rotation.y=Math.atan2(tan.x,tan.z);
    scene.add(tile);
  }
}

function createCar(){
  car=new THREE.Group();

  const paint=new THREE.MeshPhysicalMaterial({
    color:0xd5222a,metalness:.72,roughness:.24,clearcoat:1,clearcoatRoughness:.15
  });
  const black=material(0x101419,.4,.25);
  const glass=new THREE.MeshPhysicalMaterial({
    color:0x152a38,metalness:.4,roughness:.13,clearcoat:1
  });
  const rubber=material(0x111214,1);
  const rim=material(0xaab4bc,.25,.8);
  const lightMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xcdeaff,emissiveIntensity:1.4});
  const tailMat=new THREE.MeshStandardMaterial({color:0xff1729,emissive:0x9d0010,emissiveIntensity:1.5});

  function box(parent,w,h,d,mat,x,y,z){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z);
    m.castShadow=true;
    m.receiveShadow=true;
    parent.add(m);
    return m;
  }

  // Low, wide GT car body
  box(car,2.05,.48,4.35,paint,0,.72,0);
  box(car,1.88,.24,1.1,paint,0,.98,1.45);
  box(car,1.75,.22,1.0,paint,0,.93,-1.55);

  // Hood and front splitter
  box(car,1.65,.14,1.35,paint,0,.98,1.05);
  box(car,2.2,.12,.48,black,0,.48,2.08);

  // Cabin and windscreen
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.38,.63,1.8),glass);
  cabin.position.set(0,1.23,-.12);
  cabin.castShadow=true;
  car.add(cabin);
  box(car,1.48,.08,1.9,black,0,1.52,-.12);

  // Rear wing
  box(car,2.0,.12,.35,black,0,1.43,-1.95);
  box(car,.12,.38,.12,black,-.7,1.24,-1.85);
  box(car,.12,.38,.12,black,.7,1.24,-1.85);

  // Headlights and tail lights
  box(car,.35,.12,.08,lightMat,-.72,.83,2.16);
  box(car,.35,.12,.08,lightMat,.72,.83,2.16);
  box(car,.48,.12,.08,tailMat,-.65,.84,-2.2);
  box(car,.48,.12,.08,tailMat,.65,.84,-2.2);

  // Wheels
  for(const x of [-1.03,1.03]){
    for(const z of [-1.42,1.42]){
      const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,24),rubber);
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(x,.48,z);
      wheel.castShadow=true;
      car.add(wheel);

      const hub=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.295,16),rim);
      hub.rotation.z=Math.PI/2;
      hub.position.set(x,.48,z);
      car.add(hub);

      const spokes=new THREE.Group();
      for(let j=0;j<5;j++){
        const sp=new THREE.Mesh(new THREE.BoxGeometry(.045,.35,.06),black);
        sp.position.y=.0;
        sp.rotation.x=j*Math.PI/5;
        spokes.add(sp);
      }
      spokes.position.set(x*1.01,.48,z);
      car.add(spokes);
      (z>0?frontWheels:rearWheels).push(wheel);
    }
  }

  // Mirrors
  box(car,.22,.12,.32,paint,-1.02,1.12,.55);
  box(car,.22,.12,.32,paint,1.02,1.12,.55);

  car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  scene.add(car);
  placeCarAt(0,0);
}

function placeCarAt(t,offset){
  const p=roadCurve.getPointAt(((t%1)+1)%1);
  const tan=roadCurve.getTangentAt(((t%1)+1)%1).normalize();
  const side=new THREE.Vector3(-tan.z,0,tan.x);
  car.position.set(p.x+side.x*offset,.02,p.z+side.z*offset);
  car.rotation.y=Math.atan2(tan.x,tan.z);
}

function bindButton(id,callback){
  const el=$(id);
  const down=e=>{e.preventDefault();el.classList.add('active');callback(true)};
  const up=e=>{e.preventDefault();el.classList.remove('active');callback(false)};
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

async function startRace(){
  if(running)return;
  $('startBtn').disabled=true;
  $('sensorStatus').textContent='センサーを確認しています…';

  try{
    if(typeof DeviceOrientationEvent!=='undefined' &&
       typeof DeviceOrientationEvent.requestPermission==='function'){
      const result=await DeviceOrientationEvent.requestPermission();
      if(result==='granted'){
        window.addEventListener('deviceorientation',onOrientation,true);
        sensorEnabled=true;
      }
    }else if('DeviceOrientationEvent' in window){
      window.addEventListener('deviceorientation',onOrientation,true);
      sensorEnabled=true;
    }
  }catch(e){
    sensorEnabled=false;
  }

  running=true;
  finished=false;
  speed=0;steer=0;lateral=0;progress=0;lap=1;
  elapsed=0;lapStart=0;raceStart=performance.now();
  lastLapProgress=0;lapTimes=[];
  $('lap').textContent='LAP 1 / '+totalLaps;
  $('message').textContent='GO!';
  $('engine').textContent='RUN';
  $('sensorStatus').textContent=sensorEnabled?
    'センサー有効。端末の向きで操作できます。':
    'センサー未使用。画面のボタンで操作してください。';
  $('startScreen').style.display='none';
  placeCarAt(0,0);
  setTimeout(()=>{if(running)$('message').textContent=''},1300);
  lastTime=performance.now();
}

function onOrientation(e){
  if(e.gamma==null||e.beta==null)return;
  if(baseGamma===null){baseGamma=e.gamma;baseBeta=e.beta;}
  // Landscape phone: gamma usually changes when steering left/right.
  tiltSteer=clamp((e.gamma-baseGamma)/25,-1,1);
  // Pitch is an approximation for forward/back input.
  pitchControl=clamp((e.beta-baseBeta)/18,-1,1);
}

function resetCar(){
  speed=0;lateral=0;steer=0;
  progress=Math.floor(progress)*1;
  placeCarAt(progress%1,0);
}

function animate(now=performance.now()){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastTime)/1000,.05);
  lastTime=now;

  if(running&&!finished)update(dt,now);
  updateCamera(dt);
  renderer.render(scene,camera);
}

function update(dt,now){
  const steeringInput=clamp(
    ((rightButton?1:0)-(leftButton?1:0))+
    (sensorEnabled?tiltSteer:0),-1,1
  );

  steer=lerp(steer,steeringInput,Math.min(1,dt*5));

  let throttle=gasButton?1:0;
  let braking=brakeButton?1:0;

  // Tilt-based throttle and brake. Buttons remain available as fallback.
  if(sensorEnabled){
    if(pitchControl>.32)throttle=1;
