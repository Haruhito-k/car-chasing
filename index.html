
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D Tilt Racing - Winding Road</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  overflow: hidden; background: #101820; color: white;
  font-family: Arial, sans-serif; touch-action: manipulation;
}
#game { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; }
#hud {
  position: fixed; top: 10px; left: 10px; right: 10px;
  display: flex; justify-content: space-between; gap: 8px;
  pointer-events: none; z-index: 2;
}
.panel {
  background: #07111ddd; border: 1px solid #ffffff33;
  border-radius: 10px; padding: 9px 12px;
  font-size: 13px; line-height: 1.6;
}
#sensorPanel {
  position: fixed; left: 10px; bottom: 10px; z-index: 5;
  width: min(290px, calc(100% - 20px));
  background: #07111def; border: 1px solid #ffffff40;
  border-radius: 10px; padding: 9px; font-size: 11px;
  line-height: 1.5; overflow-wrap: anywhere;
}
#sensorTitle { font-weight: bold; color: #55e8ff; }
#sensorStatus { color: #ffd166; }
#menu, #portraitOnly {
  position: fixed; inset: 0; display: flex;
  justify-content: center; align-items: center;
  background: #06101aee; padding: 18px; z-index: 10;
}
#menuCard, #portraitCard {
  width: min(460px, 100%); background: #111d2b;
  border: 1px solid #4a718e; border-radius: 18px;
  padding: 22px; text-align: center;
}
h1 { margin: 0 0 10px; font-size: clamp(27px, 7vw, 42px); }
p { line-height: 1.65; color: #d5e3ed; font-size: 14px; }
button {
  border: 0; border-radius: 10px; padding: 12px;
  font-size: 15px; font-weight: bold; cursor: pointer;
  color: #06121a; background: #55e8ff;
}
#startBtn { width: 100%; margin-top: 8px; }
#recalibrateBtn { padding: 6px 9px; font-size: 11px; margin-top: 5px; }
#warning { color: #ffd166; font-size: 12px; }
#touchControls {
  position: fixed; bottom: 16px; right: 10px;
  display: flex; gap: 6px; align-items: end; z-index: 4;
}
.touchBtn {
  width: 56px; height: 56px; border-radius: 50%;
  background: #142b3ddd; color: white;
  border: 2px solid #ffffff88; font-size: 11px;
  touch-action: none; padding: 2px;
}
#leftBtn, #rightBtn { width: 45px; height: 45px; font-size: 17px; }
#portraitOnly { display: none; background: #07111df5; }
#portraitCard { max-width: 350px; }
#portraitIcon { font-size: 48px; }
@media (orientation: landscape) {
  #portraitOnly { display: flex !important; }
}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="panel">
    <strong>🏁 TILT RACING</strong><br>
    速度：<span id="speed">0</span> km/h<br>
    距離：<span id="distance">0</span> m
  </div>
  <div class="panel">
    一本道・自由走行<br>
    <span id="driveStatus">スタート待ち</span>
  </div>
</div>

<div id="sensorPanel">
  <div id="sensorTitle">センサー診断</div>
  状態：<span id="sensorStatus">未接続</span><br>
  beta：<span id="betaValue">--</span>°　
  gamma：<span id="gammaValue">--</span>°<br>
  前後差：<span id="pitchDelta">--</span>°　
  左右差：<span id="rollDelta">--</span>°<br>
  <button id="recalibrateBtn">今の角度を基準にする</button>
</div>

<div id="menu">
  <div id="menuCard">
    <h1>3D TILT RACING</h1>
    <p>
      左右にクネクネ曲がる一本道を走ろう！<br><br>
      <b>手前に傾ける：</b>アクセル<br>
      <b>前に傾ける：</b>ブレーキ<br>
      <b>左右に傾ける：</b>ハンドル<br><br>
      道から外れても、自動で戻されません。
      好きな方向にハンドルを切って走ってください。
    </p>
    <p id="warning">縦向きでプレイしてください。</p>
    <button id="startBtn">レース開始・センサー接続</button>
  </div>
</div>

<div id="portraitOnly">
  <div id="portraitCard">
    <div id="portraitIcon">📱</div>
    <h1>縦向きにしてください</h1>
    <p>このゲームは縦向き専用です。スマホの画面下端を下にして持ってください。</p>
  </div>
</div>

<div id="touchControls">
  <button class="touchBtn" id="leftBtn">◀</button>
  <button class="touchBtn" id="rightBtn">▶</button>
  <button class="touchBtn" id="brakeBtn">ブレーキ</button>
  <button class="touchBtn" id="accelBtn">アクセル</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

let scene, camera, renderer, car, roadCurve;
let wheels = [];
let running = false;
let lastTime = 0;

let speed = 0;
let distance = 0;
let steering = 0;
let carX = 0;
let carZ = 0;
let carHeading = 0;

let latestBeta = null;
let latestGamma = null;
let baseBeta = null;
let baseGamma = null;
let sensorLastTime = 0;
let sensorConnected = false;
let calibrating = false;

let accelTouch = false;
let brakeTouch = false;
let leftTouch = false;
let rightTouch = false;

const ROAD_WIDTH = 14;
const MAX_SPEED = 210;

// スマホによって傾きの正負が異なる場合は変更する。
const PITCH_SIGN = 1;
const ROLL_SIGN = 1;

// 左右の感度を大きくした設定
const STEER_SENSITIVITY = 1.65;
const STEER_RESPONSE = 7.5;
const LATERAL_SPEED = 18;

function setStatus(text, color) {
  $("sensorStatus").textContent = text;
  if (color) $("sensorStatus").style.color = color;
}

function initScene() {
  if (renderer) return;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8ac7ed);
  scene.fog = new THREE.Fog(0x8ac7ed, 100, 420);

  camera = new THREE.PerspectiveCamera(
    66, window.innerWidth / window.innerHeight, 0.1, 2000
  );

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  $("game").appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x435363, 2));

  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-40, 80, 35);
  sun.castShadow = true;
  scene.add(sun);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(5000, 5000),
    new THREE.MeshStandardMaterial({ color: 0x39834c })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.3;
  ground.receiveShadow = true;
  scene.add(ground);

  createWindingRoad();
  createCar();

  window.addEventListener("resize", onResize);
  onResize();
}

// 長く続く、左右に大きく蛇行する一本道。
// 車が進むほど先の道路が生成されるため、終端に突き当たらない。
function roadX(z) {
  return Math.sin(z * 0.008) * 40
       + Math.sin(z * 0.018 + 1.1) * 19
       + Math.sin(z * 0.0035) * 25;
}

function createWindingRoad() {
  const points = [];
  const startZ = 160;
  const endZ = -2600;
  const step = 3;

  for (let z = startZ; z >= endZ; z -= step) {
    points.push(new THREE.Vector3(roadX(z), 0, z));
  }

  roadCurve = new THREE.CatmullRomCurve3(points, false, "catmullrom", 0.1);

  const verts = [];
  const indices = [];
  const colors = [];
  const divisions = points.length - 1;

  for (let i = 0; i <= divisions; i++) {
    const p = roadCurve.getPointAt(i / divisions);
    const tangent = roadCurve.getTangentAt(i / divisions).normalize();
    const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

    const left = p.clone().addScaledVector(side, ROAD_WIDTH / 2);
    const right = p.clone().addScaledVector(side, -ROAD_WIDTH / 2);
    left.y = right.y = 0.025;

    verts.push(left.x, left.y, left.z, right.x, right.y, right.z);

    const c = 0.23 + (i % 12 < 6 ? 0.035 : 0);
    colors.push(c, c, c, c, c, c);

    if (i < divisions) {
      const n = i * 2;
      indices.push(n, n + 1, n + 2, n + 1, n + 3, n + 2);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const road = new THREE.Mesh(
    geometry,
    new THREE.MeshStandardMaterial({
      vertexColors: true,
      side: THREE.DoubleSide,
      roughness: 0.95
    })
  );
  road.receiveShadow = true;
  scene.add(road);

  // 道路の両端に線を引く。壁や衝突判定は設けない。
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f2 });
  const edgeRedMat = new THREE.MeshStandardMaterial({ color: 0xe64747 });

  for (let i = 0; i < divisions; i += 3) {
    const t = i / divisions;
    const p = roadCurve.getPointAt(t);
    const tangent = roadCurve.getTangentAt(t).normalize();
    const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

    for (const sign of [-1, 1]) {
      const edge = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, 0.035, 2.8),
        (Math.floor(i / 3) % 2 === 0) ? edgeMat : edgeRedMat
      );
      edge.position.copy(p).addScaledVector(side, sign * (ROAD_WIDTH / 2 - 0.12));
      edge.position.y = 0.055;
      edge.rotation.y = Math.atan2(tangent.x, tangent.z);
      scene.add(edge);
    }
  }

  // 遠くの山だけを背景に配置。道路上に障害物は置かない。
  const mountainMat = new THREE.MeshStandardMaterial({ color: 0x78929b });
  for (let i = 0; i < 80; i++) {
    const z = 100 - i * 37;
    for (const sign of [-1, 1]) {
      const h = 16 + Math.random() * 38;
      const mountain = new THREE.Mesh(
        new THREE.ConeGeometry(10 + Math.random() * 15, h, 6),
        mountainMat
      );
      mountain.position.set(
        roadX(z) + sign * (100 + Math.random() * 70),
        h / 2 - 1,
        z
      );
      scene.add(mountain);
    }
  }
}

function createCar() {
  car = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x12a9ef, metalness: 0.55, roughness: 0.28
  });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x101923 });
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x8dd9f4, metalness: 0.35, roughness: 0.15
  });

  function part(geo, mat, x, y, z) {
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    car.add(mesh);
    return mesh;
  }

  part(new THREE.BoxGeometry(2.1, 0.55, 4.2), bodyMat, 0, 0.65, 0);
  part(new THREE.BoxGeometry(1.55, 0.65, 1.85), glassMat, 0, 1.18, -0.25);
  part(new THREE.BoxGeometry(1.75, 0.16, 1.2), bodyMat, 0, 0.98, 1.35);
  part(new THREE.BoxGeometry(1.9, 0.12, 0.45), darkMat, 0, 0.95, -1.95);

  for (const x of [-0.72, 0.72]) {
    part(new THREE.BoxGeometry(0.32, 0.18, 0.12),
      new THREE.MeshStandardMaterial({ color: 0xffffff }), x, 0.72, 2.12);
    part(new THREE.BoxGeometry(0.32, 0.18, 0.12),
      new THREE.MeshStandardMaterial({ color: 0xff2222, emissive: 0x880000 }),
      x, 0.72, -2.12);
  }

  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xb9c4ca, metalness: 0.7 });

  for (const x of [-1.05, 1.05]) {
    for (const z of [-1.35, 1.35]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.39, 0.39, 0.25, 20), wheelMat
      );
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.4, z);
      car.add(wheel);
      wheels.push(wheel);

      const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(0.19, 0.19, 0.27, 12), rimMat
      );
      rim.rotation.z = Math.PI / 2;
      rim.position.set(x * 1.01, 0.4, z);
      car.add(rim);
    }
  }

  scene.add(car);
}

function onResize() {
  if (!camera || !renderer) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function updateDiagnostic() {
  if (latestBeta === null || latestGamma === null) return;

  $("betaValue").textContent = latestBeta.toFixed(1);
  $("gammaValue").textContent = latestGamma.toFixed(1);

  if (baseBeta !== null && baseGamma !== null) {
    $("pitchDelta").textContent = (latestBeta - baseBeta).toFixed(1);
    $("rollDelta").textContent = (latestGamma - baseGamma).toFixed(1);
  }
}

function handleOrientation(event) {
  if (typeof event.beta !== "number" ||
      typeof event.gamma !== "number" ||
      !Number.isFinite(event.beta) ||
      !Number.isFinite(event.gamma)) return;

  latestBeta = event.beta;
  latestGamma = event.gamma;
  sensorLastTime = performance.now();
  sensorConnected = true;

  if (calibrating || baseBeta === null || baseGamma === null) {
    baseBeta = latestBeta;
    baseGamma = latestGamma;
    calibrating = false;
    setStatus("接続済み・基準設定完了", "#7dff9b");
  } else {
    setStatus("接続済み・受信中", "#7dff9b");
  }
  updateDiagnostic();
}

async function connectSensors() {
  setStatus("センサー接続中…", "#ffd166");

  if (!("DeviceOrientationEvent" in window)) {
    setStatus("センサーAPIを利用できません", "#ff8d8d");
    return false;
  }

  try {
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") {
        setStatus("センサー許可が拒否されました", "#ff8d8d");
        return false;
      }
    }
  } catch (error) {
    setStatus("センサーエラー：" + error.message, "#ff8d8d");
    return false;
  }

  window.removeEventListener("deviceorientation", handleOrientation);
  latestBeta = null;
  latestGamma = null;
  baseBeta = null;
  baseGamma = null;
  sensorConnected = false;
  calibrating = true;

  window.addEventListener("deviceorientation", handleOrientation, true);
  setStatus("センサー値を待っています…", "#ffd166");

  setTimeout(() => {
    if (!sensorConnected) {
      setStatus("データなし：HTTPS等を確認", "#ff8d8d");
    }
  }, 4500);

  return true;
}

$("startBtn").addEventListener("click", async () => {
  if (window.matchMedia("(orientation: landscape)").matches) {
    $("warning").textContent = "縦向きにしてから開始してください。";
    return;
  }

  $("startBtn").disabled = true;
  initScene();
  await connectSensors();
  $("menu").style.display = "none";
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(animate);
  $("startBtn").disabled = false;
});

$("recalibrateBtn").addEventListener("click", () => {
  if (latestBeta === null || latestGamma === null) {
    setStatus("センサー値を待っています", "#ff8d8d");
    return;
  }
  baseBeta = latestBeta;
  baseGamma = latestGamma;
  calibrating = false;
  updateDiagnostic();
  setStatus("基準角度を更新しました", "#7dff9b");
});

function bindHold(id, setter) {
  const el = $(id);
  const down = e => { e.preventDefault(); setter(true); };
  const up = e => { e.preventDefault(); setter(false); };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("pointerleave", up);
}

bindHold("leftBtn", v => leftTouch = v);
bindHold("rightBtn", v => rightTouch = v);
bindHold("accelBtn", v => accelTouch = v);
bindHold("brakeBtn", v => brakeTouch = v);

window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") leftTouch = true;
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") rightTouch = true;
  if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") accelTouch = true;
  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") brakeTouch = true;
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") leftTouch = false;
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") rightTouch = false;
  if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") accelTouch = false;
  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") brakeTouch = false;
});

function animate(now) {
  if (!running) return;
  requestAnimationFrame(animate);

  if (window.matchMedia("(orientation: landscape)").matches) {
    $("portraitOnly").style.display = "flex";
    lastTime = now;
    return;
  }
  $("portraitOnly").style.display = "none";

  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (sensorConnected && now - sensorLastTime > 3000) {
    setStatus("センサー受信が停止しました", "#ff8d8d");
  }

  let pitch = 0;
  let roll = 0;

  if (latestBeta !== null && baseBeta !== null) {
    pitch = (latestBeta - baseBeta) * PITCH_SIGN;
  }
  if (latestGamma !== null && baseGamma !== null) {
    roll = (latestGamma - baseGamma) * ROLL_SIGN;
  }

  // 手前に傾けるとアクセル、前に傾けるとブレーキ
  const tiltAccel = Math.max(0, Math.min(1, (-pitch - 3) / 12));
  const tiltBrake = Math.max(0, Math.min(1, (pitch - 3) / 12));

  const accelerating = tiltAccel > 0 || accelTouch;
  const braking = tiltBrake > 0 || brakeTouch;

  // 感度を上げ、少しの傾きでも大きく曲がる。
  let steerInput = Math.max(-1, Math.min(1, roll / 11 * STEER_SENSITIVITY));
  if (leftTouch) steerInput -= 1;
  if (rightTouch) steerInput += 1;
  steerInput = Math.max(-1, Math.min(1, steerInput));

  steering += (steerInput - steering) * Math.min(1, dt * STEER_RESPONSE);

  if (accelerating) {
    speed += (Math.max(tiltAccel, accelTouch ? 1 : 0) * 42 + 6) * dt;
  } else {
    speed -= 5 * dt;
  }
  if (braking) speed -= (65 + tiltBrake * 35) * dt;
  speed = Math.max(0, Math.min(MAX_SPEED, speed));

  // 一本道に沿って前進する。横方向は制限せず、コース外でも自由に移動。
  const forwardSpeed = speed / 3.6;
  carZ -= forwardSpeed * dt;

  // 現在位置付近の道の向きを計算する。
  const centerX = roadX(carZ);
  const aheadX = roadX(carZ - 5);
  const behindX = roadX(carZ + 5);
  const roadDirection = Math.atan2(aheadX - behindX, -10);

  // ハンドルは道路基準ではなく、車の向きに応じて横へ移動させる。
  carHeading += steering * (1.25 + speed / 100) * dt;
  const moveSpeed = forwardSpeed;
  carX += Math.sin(carHeading) * moveSpeed * dt;
  carZ -= Math.cos(carHeading) * moveSpeed * dt;

  car.position.set(carX, 0.1, carZ);
  car.rotation.y = carHeading;
  car.rotation.z = -steering * 0.08;

  for (const wheel of wheels) wheel.rotation.x += speed * dt * 0.015;

  // 車の後方から追従するカメラ
  const behind = new THREE.Vector3(
    -Math.sin(carHeading) * 9,
    5.2,
    Math.cos(carHeading) * 9
  );
  const cameraTarget = car.position.clone().add(behind);
  camera.position.lerp(cameraTarget, Math.min(1, dt * 5));

  const look = car.position.clone().add(new THREE.Vector3(
    Math.sin(carHeading) * 12,
    1.1,
    -Math.cos(carHeading) * 12
  ));
  camera.lookAt(look);

  distance += forwardSpeed * dt;
  $("speed").textContent = Math.round(speed);
  $("distance").textContent = Math.floor(distance);
  $("driveStatus").textContent = sensorConnected ? "センサー接続済み" : "センサー確認中";

  renderer.render(scene, camera);
}

window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    onResize();
    if (running) lastTime = performance.now();
  }, 250);
});

})();
</script>
</body>
</html>
