
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D Tilt Racing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:white;font-family:Arial,sans-serif;touch-action:manipulation}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;align-items:flex-start}
.panel{background:#07111ddd;border:1px solid #ffffff33;border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.55}
#sensorPanel{position:fixed;left:8px;bottom:8px;width:min(290px,calc(100% - 16px));background:#07111def;border:1px solid #ffffff40;border-radius:10px;padding:8px;font-size:11px;line-height:1.5;overflow-wrap:anywhere;z-index:5}
#sensorTitle{font-weight:bold;color:#55e8ff}
#sensorStatus{color:#ffd166}
#menu,#portraitOnly{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#06101aef;padding:18px;z-index:10}
#menuCard,#portraitCard{width:min(460px,100%);background:#111d2b;border:1px solid #4a718e;border-radius:18px;padding:22px;text-align:center;box-shadow:0 10px 40px #0008}
h1{margin:0 0 10px;font-size:clamp(27px,7vw,40px)}
p{line-height:1.6;color:#d5e3ed;font-size:14px}
button{border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:bold;cursor:pointer;color:#06121a;background:#55e8ff}
button:active{transform:scale(.97)}
#startBtn{width:100%;margin-top:8px}
#recalibrateBtn{padding:7px 9px;font-size:11px;margin-top:5px}
#warning{color:#ffd166;font-size:12px}
#touchControls{position:fixed;bottom:18px;right:10px;display:flex;gap:6px;align-items:end;z-index:4}
.touchBtn{width:55px;height:55px;border-radius:50%;background:#142b3ddd;color:white;border:2px solid #ffffff88;font-size:11px;touch-action:none;padding:3px}
#leftBtn,#rightBtn{width:46px;height:46px;font-size:17px}
#portraitOnly{display:none;background:#07111df5}
#portraitCard{max-width:350px}
@media (orientation:landscape){#portraitOnly{display:flex!important}}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="panel">
    <strong>🏁 TILT RACING</strong><br>
    速度：<span id="speed">0</span> km/h<br>
    距離：<span id="distance">0</span> m
  </div>
  <div class="panel">
    <span id="lap">LAP 1 / 3</span><br>
    <span id="driveStatus">スタート待ち</span>
  </div>
</div>

<div id="sensorPanel">
  <div id="sensorTitle">センサー診断</div>
  状態：<span id="sensorStatus">未接続</span><br>
  beta（前後）：<span id="betaValue">--</span>°　
  gamma（左右）：<span id="gammaValue">--</span>°<br>
  基準から：前後 <span id="pitchDelta">--</span>° ／ 左右 <span id="rollDelta">--</span>°<br>
  <button id="recalibrateBtn">今の角度を基準にする</button>
</div>

<div id="menu">
  <div id="menuCard">
    <h1>3D TILT RACING</h1>
    <p>
      <b>手前に傾ける：</b>アクセル<br>
      <b>前に傾ける：</b>ブレーキ<br>
      <b>左右に傾ける：</b>ハンドル<br><br>
      S字カーブが連続するコースを3周します。<br>
      縦向きでスマホを静止させてから開始してください。
    </p>
    <p id="warning">傾きセンサーが使えない場合も、画面ボタンで操作できます。</p>
    <button id="startBtn">レース開始</button>
  </div>
</div>

<div id="portraitOnly">
  <div id="portraitCard">
    <div style="font-size:48px">📱</div>
    <h1>縦向きにしてください</h1>
    <p>画面の下端を下にした縦向き専用です。スマホを縦向きに戻すと再開できます。</p>
  </div>
</div>

<div id="touchControls">
  <button class="touchBtn" id="leftBtn">◀</button>
  <button class="touchBtn" id="rightBtn">▶</button>
  <button class="touchBtn" id="brakeBtn">ブレーキ</button>
  <button class="touchBtn" id="accelBtn">アクセル</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

let scene, camera, renderer, car, roadCurve;
let wheels = [];
let running = false;
let lastTime = 0;

let speed = 0;
let distance = 0;
let steering = 0;
let lateral = 0;
let sensorConnected = false;
let sensorLastTime = 0;

let latestBeta = null, latestGamma = null;
let baseBeta = null, baseGamma = null;
let calibrating = false;

let accelTouch = false, brakeTouch = false;
let leftTouch = false, rightTouch = false;
let finished = false;

const ROAD_WIDTH = 13;
const MAX_SPEED = 190;
const LAPS = 3;

// 操作感度：数値を小さくすると、より少ない傾きで反応します。
// 以前の18から10へ変更し、ハンドルの感度を約1.8倍にしています。
const STEER_ANGLE = 10;
const PITCH_SIGN = 1;
const ROLL_SIGN = 1;

function setStatus(text, color) {
  $("sensorStatus").textContent = text;
  if (color) $("sensorStatus").style.color = color;
}

function initScene() {
  if (renderer) return;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87c8ed);
  scene.fog = new THREE.Fog(0x87c8ed, 100, 330);

  camera = new THREE.PerspectiveCamera(
    65, window.innerWidth / window.innerHeight, 0.1, 1000
  );

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $("game").appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x455565, 2));

  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-40, 70, 35);
  sun.castShadow = true;
  scene.add(sun);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1500,1500),
    new THREE.MeshStandardMaterial({color:0x37834b})
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.2;
  ground.receiveShadow = true;
  scene.add(ground);

  createTrack();
  createCar();
  createScenery();

  window.addEventListener("resize", onResize);
  onResize();
}

/* 大きく左右に蛇行するS字コース */
function createTrack() {
  const points = [
    [0,0,0],
    [18,0,-25],
    [48,0,-43],
    [78,0,-30],
    [83,0,0],
    [60,0,25],
    [25,0,38],
    [-5,0,30],
    [-35,0,12],
    [-62,0,20],
    [-78,0,48],
    [-65,0,75],
    [-35,0,87],
    [-8,0,72],
    [18,0,52],
    [42,0,61],
    [53,0,88],
    [38,0,115],
    [8,0,125],
    [-20,0,112],
    [-35,0,91],
    [-58,0,98],
    [-83,0,124],
    [-78,0,154],
    [-52,0,170],
    [-20,0,160],
    [2,0,140],
    [25,0,145],
    [48,0,171],
    [42,0,198],
    [16,0,215],
    [-15,0,207],
    [-34,0,187],
    [-57,0,194],
    [-75,0,220],
    [-63,0,247],
    [-35,0,258],
    [-5,0,247],
    [18,0,228],
    [42,0,238],
    [60,0,265],
    [48,0,290],
    [18,0,302],
    [-12,0,288],
    [-35,0,268],
    [-60,0,278],
    [-76,0,306],
    [-60,0,333],
    [-30,0,341],
    [0,0,325],
    [22,0,306],
    [43,0,315],
    [55,0,343],
    [35,0,366],
    [4,0,370],
    [-20,0,352],
    [-37,0,332],
    [-58,0,340],
    [-72,0,365],
    [-55,0,390],
    [-25,0,398],
    [4,0,385],
    [23,0,365],
    [46,0,375],
    [57,0,402],
    [38,0,425],
    [8,0,431],
    [-18,0,415],
    [-36,0,396],
    [-53,0,407],
    [-58,0,432],
    [-35,0,450],
    [-7,0,445],
    [0,0,420]
  ].map(p => new THREE.Vector3(p[0],p[1],p[2]));

  roadCurve = new THREE.CatmullRomCurve3(points, true, "catmullrom", 0.35);

  const divisions = 1600;
  const verts = [];
  const indices = [];
  const colors = [];

  for (let i=0; i<=divisions; i++) {
    const t = i/divisions;
    const p = roadCurve.getPointAt(t);
    const tangent = roadCurve.getTangentAt(t).normalize();
    const side = new THREE.Vector3(-tangent.z,0,tangent.x).normalize();

    const left = p.clone().addScaledVector(side, ROAD_WIDTH/2);
    const right = p.clone().addScaledVector(side,-ROAD_WIDTH/2);
    left.y = right.y = 0.03;

    verts.push(left.x,left.y,left.z,right.x,right.y,right.z);
    const c = Math.floor(i/7)%2 ? 0.24 : 0.28;
    colors.push(c,c,c,c,c,c);

    if (i<divisions) {
      const n=i*2;
      indices.push(n,n+1,n+2,n+1,n+3,n+2);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
  geo.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const road = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({
      vertexColors:true, side:THREE.DoubleSide, roughness:0.85
    })
  );
  road.receiveShadow = true;
  scene.add(road);

  // 左右の赤白縁石
  const white = new THREE.MeshStandardMaterial({color:0xffffff});
  const red = new THREE.MeshStandardMaterial({color:0xe52d36});

  for (let i=0; i<divisions; i+=5) {
    const t=i/divisions;
    const p=roadCurve.getPointAt(t);
    const tangent=roadCurve.getTangentAt(t).normalize();
    const side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();

    for (const sign of [-1,1]) {
      const curb = new THREE.Mesh(
        new THREE.BoxGeometry(1.05,0.17,1.8),
        Math.floor(i/5)%2 ? white : red
      );
      curb.position.copy(p).addScaledVector(side,sign*(ROAD_WIDTH/2+0.55));
      curb.position.y=0.09;
      curb.rotation.y=Math.atan2(tangent.x,tangent.z);
      scene.add(curb);
    }
  }

  // スタートライン
  const p=roadCurve.getPointAt(0);
  const tan=roadCurve.getTangentAt(0);
  const line=new THREE.Mesh(
    new THREE.BoxGeometry(ROAD_WIDTH,0.04,1.6),
    new THREE.MeshStandardMaterial({color:0xffffff})
  );
  line.position.set(p.x,0.07,p.z);
  line.rotation.y=Math.atan2(tan.x,tan.z);
  scene.add(line);
}

function createScenery() {
  const mountainMat = new THREE.MeshStandardMaterial({color:0x718b98});
  for (let i=0;i<90;i++) {
    const a=Math.random()*Math.PI*2;
    const r=150+Math.random()*90;
    const h=15+Math.random()*35;
    const m=new THREE.Mesh(
      new THREE.ConeGeometry(8+Math.random()*15,h,6),
      mountainMat
    );
    m.position.set(Math.cos(a)*r,h/2-1,Math.sin(a)*r+200);
    scene.add(m);
  }

  const treeMat = new THREE.MeshStandardMaterial({color:0x1f633b});
  const trunkMat = new THREE.MeshStandardMaterial({color:0x65432b});

  for (let i=0;i<100;i++) {
    const t=Math.random();
    const p=roadCurve.getPointAt(t);
    const tan=roadCurve.getTangentAt(t).normalize();
    const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    const sign=Math.random()<0.5 ? -1 : 1;
    const pos=p.clone().addScaledVector(side,ROAD_WIDTH/2+8+Math.random()*20);

    const trunk=new THREE.Mesh(
      new THREE.CylinderGeometry(0.3,0.45,3,6),trunkMat
    );
    trunk.position.set(pos.x,1.5,pos.z);
    scene.add(trunk);

    const crown=new THREE.Mesh(
      new THREE.ConeGeometry(2.2+Math.random()*1.5,5+Math.random()*3,7),
      treeMat
    );
    crown.position.set(pos.x,5,pos.z);
    scene.add(crown);
  }
}

function createCar() {
  car = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({
    color:0x08a9f4,metalness:0.5,roughness:0.27
  });
  const glassMat = new THREE.MeshStandardMaterial({
    color:0x9be2fa,metalness:0.25,roughness:0.15
  });
  const darkMat = new THREE.MeshStandardMaterial({color:0x141820});

  function part(geo,mat,x,y,z) {
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z);
    m.castShadow=true;
    car.add(m);
    return m;
  }

  part(new THREE.BoxGeometry(2.05,0.55,4.1),bodyMat,0,0.65,0);
  part(new THREE.BoxGeometry(1.5,0.65,1.85),glassMat,0,1.15,-0.25);
  part(new THREE.BoxGeometry(1.8,0.13,0.7),bodyMat,0,0.95,1.55);
  part(new THREE.BoxGeometry(1.85,0.13,0.45),darkMat,0,0.95,-1.85);

  for (const x of [-0.72,0.72]) {
    part(new THREE.BoxGeometry(0.3,0.17,0.12),
      new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xcccccc}),
      x,0.7,2.08);
    part(new THREE.BoxGeometry(0.3,0.17,0.12),
      new THREE.MeshStandardMaterial({color:0xff2222,emissive:0x770000}),
      x,0.7,-2.08);
  }

  const wheelMat = new THREE.MeshStandardMaterial({color:0x111111});
  const rimMat = new THREE.MeshStandardMaterial({color:0xbfcbd0,metalness:0.7});

  for (const x of [-1.03,1.03]) {
    for (const z of [-1.3,1.3]) {
      const wheel=new THREE.Mesh(
        new THREE.CylinderGeometry(0.37,0.37,0.25,20),wheelMat
      );
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(x,0.38,z);
      car.add(wheel);
      wheels.push(wheel);

      const rim=new THREE.Mesh(
        new THREE.CylinderGeometry(0.18,0.18,0.27,12),rimMat
      );
      rim.rotation.z=Math.PI/2;
      rim.position.set(x*1.01,0.38,z);
      car.add(rim);
    }
  }
  scene.add(car);
}

function onResize() {
  if (!camera || !renderer) return;
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

function updateDiagnostic() {
  if (latestBeta===null || latestGamma===null) return;
  $("betaValue").textContent=latestBeta.toFixed(1);
  $("gammaValue").textContent=latestGamma.toFixed(1);
  if (baseBeta!==null && baseGamma!==null) {
    $("pitchDelta").textContent=(latestBeta-baseBeta).toFixed(1);
    $("rollDelta").textContent=(latestGamma-baseGamma).toFixed(1);
  }
}

function handleOrientation(e) {
  if (typeof e.beta!=="number" || typeof e.gamma!=="number") return;
  latestBeta=e.beta;
  latestGamma=e.gamma;
  sensorLastTime=performance.now();
  sensorConnected=true;

  if (calibrating || baseBeta===null || baseGamma===null) {
    baseBeta=latestBeta;
    baseGamma=latestGamma;
    calibrating=false;
    setStatus("接続済み・基準設定完了","#7dff9b");
  } else {
    setStatus("接続済み・受信中","#7dff9b");
  }
  updateDiagnostic();
}

async function connectSensors() {
  setStatus("センサー接続中…","#ffd166");

  if (!("DeviceOrientationEvent" in window)) {
    setStatus("この端末でセンサーAPIが使えません","#ff8d8d");
    return;
  }

  try {
    if (typeof DeviceOrientationEvent.requestPermission==="function") {
      const permission=await DeviceOrientationEvent.requestPermission();
      if (permission!=="granted") {
        setStatus("センサー許可が拒否されました","#ff8d8d");
        return;
      }
    }
  } catch (err) {
    setStatus("センサーエラー："+err.message,"#ff8d8d");
    return;
  }

  window.removeEventListener("deviceorientation",handleOrientation,true);
  latestBeta=latestGamma=baseBeta=baseGamma=null;
  sensorConnected=false;
  calibrating=true;
  window.addEventListener("deviceorientation",handleOrientation,true);
  setStatus("センサー値を待っています…","#ffd166");

  setTimeout(()=>{
    if (!sensorConnected) {
      setStatus("データなし：HTTPSを確認","#ff8d8d");
      $("warning").textContent="GitHub PagesのHTTPS URLで開いてください。";
    }
  },4500);
}

$("startBtn").addEventListener("click",async()=>{
  $("startBtn").disabled=true;
  initScene();
  await connectSensors();
  $("menu").style.display="none";
  running=true;
  lastTime=performance.now();
  requestAnimationFrame(animate);
  $("startBtn").disabled=false;
});

$("recalibrateBtn").addEventListener("click",()=>{
  if (latestBeta===null || latestGamma===null) {
    setStatus("センサー値を待っています","#ff8d8d");
    return;
  }
  baseBeta=latestBeta;
  baseGamma=latestGamma;
  updateDiagnostic();
  setStatus("基準角度を更新しました","#7dff9b");
});

function bindHold(id,setter) {
  const el=$(id);
  const down=e=>{e.preventDefault();setter(true)};
  const up=e=>{e.preventDefault();setter(false)};
  el.addEventListener("pointerdown",down);
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("pointerleave",up);
}
bindHold("leftBtn",v=>leftTouch=v);
bindHold("rightBtn",v=>rightTouch=v);
bindHold("accelBtn",v=>accelTouch=v);
bindHold("brakeBtn",v=>brakeTouch=v);

window.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")leftTouch=true;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")rightTouch=true;
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")accelTouch=true;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")brakeTouch=true;
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")leftTouch=false;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")rightTouch=false;
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")accelTouch=false;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")brakeTouch=false;
});

function animate(now) {
  if (!running) return;
  requestAnimationFrame(animate);

  if (window.matchMedia("(orientation:landscape)").matches) {
    $("portraitOnly").style.display="flex";
    lastTime=now;
    return;
  }
  $("portraitOnly").style.display="none";

  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  if (sensorConnected && now-sensorLastTime>3000) {
    setStatus("センサー受信が停止しました","#ff8d8d");
  }

  let pitch=0,roll=0;
  if(latestBeta!==null&&baseBeta!==null)pitch=(latestBeta-baseBeta)*PITCH_SIGN;
  if(latestGamma!==null&&baseGamma!==null)roll=(latestGamma-baseGamma)*ROLL_SIGN;

  // 手前＝アクセル、前＝ブレーキ
  const tiltAccel=Math.max(0,Math.min(1,(-pitch-3)/12));
  const tiltBrake=Math.max(0,Math.min(1,(pitch-3)/12));

  let steerInput=Math.max(-1,Math.min(1,roll/STEER_ANGLE));
  if(leftTouch)steerInput-=1;
  if(rightTouch)steerInput+=1;
  steerInput=Math.max(-1,Math.min(1,steerInput));

  steering+=(steerInput-steering)*Math.min(1,dt*8);

  const accelerating=tiltAccel>0||accelTouch;
  const braking=tiltBrake>0||brakeTouch;

  if(accelerating) speed+=(Math.max(tiltAccel,accelTouch?1:0)*42+8)*dt;
  else speed-=7*dt;

  if(braking)speed-=(55+tiltBrake*35)*dt;
  speed=Math.max(0,Math.min(MAX_SPEED,speed));

  const trackLength=roadCurve.getLength();
  distance+=speed*dt/3.6;

  // 3周したらゴール
  const totalDistance=trackLength*LAPS;
  if(distance>=totalDistance) {
    distance=totalDistance;
    speed=0;
    finished=true;
    running=false;
    $("menu").style.display="flex";
    $("menuCard").innerHTML=
      '<h1>🏆 FINISH!</h1><p>3周完走！おめでとう！</p>'+
      '<button id="restartBtn" style="width:100%">もう一度プレイ</button>';
    $("restartBtn").addEventListener("click",()=>location.reload());
    return;
  }

  const progress=(distance/trackLength)%1;
  const center=roadCurve.getPointAt(progress);
  const tangent=roadCurve.getTangentAt(progress).normalize();
  const side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();

  // ハンドル感度を上げ、横移動も素早くする
  lateral+=steering*(2.0+speed/45)*dt;
  lateral=Math.max(-ROAD_WIDTH*0.46,Math.min(ROAD_WIDTH*0.46,lateral));

  const carPos=center.clone().addScaledVector(side,lateral);
  carPos.y=0.1;
  car.position.copy(carPos);

  const heading=Math.atan2(tangent.x,tangent.z);
  car.rotation.y=heading+steering*0.32;
  car.rotation.z=-steering*0.09;

  for(const wheel of wheels)wheel.rotation.x+=speed*dt*0.015;

  const camPos=carPos.clone().add(new THREE.Vector3(-tangent.x*8,4.8,-tangent.z*8));
  camera.position.lerp(camPos,Math.min(1,dt*5));
  const look=carPos.clone().addScaledVector(tangent,8);
  look.y+=1;
  camera.lookAt(look);

  $("speed").textContent=Math.round(speed);
  $("distance").textContent=Math.floor(distance);
  $("lap").textContent="LAP "+(Math.min(LAPS,Math.floor(distance/trackLength)+1))+" / "+LAPS;
  $("driveStatus").textContent=sensorConnected?"センサー接続済み":"ボタン操作可能";

  renderer.render(scene,camera);
}

window.addEventListener("orientationchange",()=>{
  setTimeout(()=>{
    onResize();
    lastTime=performance.now();
  },250);
});

})();
</script>
</body>
</html>
