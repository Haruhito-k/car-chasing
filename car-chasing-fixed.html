<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>APEX RACING 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#101820d9;border:1px solid #ffffff30;border-radius:12px;padding:10px 13px}
#tl{position:absolute;top:12px;left:12px}
#tr{position:absolute;top:12px;right:12px;text-align:right}
.brand{font-size:11px;letter-spacing:3px;color:#ffd052;font-weight:bold}
#lap{font-size:17px;font-weight:bold;margin-top:5px}
#speed{font-size:34px;font-weight:900;font-style:italic}
#tr small{font-size:10px;letter-spacing:2px;color:#bdcbd7}
#map{display:block;width:105px;height:75px;margin-top:5px}
#bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:16px;white-space:nowrap}
.stat{text-align:center}
.stat small{display:block;font-size:10px;color:#b9c8d3}
.stat strong{font-size:15px}
#message{position:absolute;top:30%;width:100%;text-align:center;font-size:27px;font-weight:900;text-shadow:0 2px 8px black}
#controls{position:fixed;inset:0;pointer-events:none}
.pad{position:absolute;bottom:20px;display:flex;gap:10px;pointer-events:auto}
#steering{left:12px}
#pedals{right:12px;flex-direction:column;gap:7px}
.ctrl{width:65px;height:65px;border:1px solid #ffffff55;border-radius:16px;background:#142435e8;color:white;font-size:25px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl:active,.ctrl.active{background:#ffd052;color:#111}
.pedal{width:78px;height:52px;font-size:12px}
#gas{background:#176c50}
#brake{background:#9a2937}
#reset{position:absolute;right:12px;bottom:155px;pointer-events:auto;border:1px solid #ffffff55;background:#101820e8;color:white;border-radius:8px;padding:9px;font-size:12px}
#startScreen{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:#06101bdc}
#card{width:min(430px,100%);padding:25px;border-radius:22px;text-align:center;background:#101a26;border:1px solid #ffffff30}
h1{font-size:clamp(32px,8vw,46px);font-style:italic;color:#ffd052;margin:10px 0}
#card p{font-size:13px;line-height:1.9;color:#d2dce5}
#startBtn{width:100%;padding:16px;border:0;border-radius:12px;background:#ffd052;color:#111;font-size:18px;font-weight:900}
#status{font-size:12px!important;color:#ffd052!important}
#error{display:none;position:fixed;z-index:20;left:10px;right:10px;top:10px;background:#701d27;color:white;padding:14px;border-radius:10px;white-space:pre-wrap;font-size:12px;max-height:45vh;overflow:auto}
@media(orientation:portrait){
 #bottom{bottom:105px;gap:9px}
 #steering,#pedals{bottom:12px}
 #reset{bottom:185px}
 #map{width:80px;height:58px}
 .ctrl{width:58px;height:58px}
 .pedal{width:70px;height:48px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="error"></div>
<div id="hud">
  <div id="tl" class="panel">
    <div class="brand">APEX RACING</div>
    <div id="lap">LAP 1 / 3</div>
    <div style="font-size:11px;margin-top:4px;color:#bdcbd7">BEST <span id="best">--:--.---</span></div>
  </div>
  <div id="tr" class="panel">
    <div id="speed">000</div><small>KM / H</small>
    <canvas id="map" width="210" height="150"></canvas>
  </div>
  <div id="message">READY</div>
  <div id="bottom" class="panel">
    <div class="stat"><small>TIME</small><strong id="time">00:00.000</strong></div>
    <div class="stat"><small>STATUS</small><strong id="engine">READY</strong></div>
  </div>
</div>
<div id="controls">
  <div id="steering" class="pad">
    <button id="left" class="ctrl" aria-label="左">◀</button>
    <button id="right" class="ctrl" aria-label="右">▶</button>
  </div>
  <div id="pedals" class="pad">
    <button id="gas" class="ctrl pedal">▲ ACCEL</button>
    <button id="brake" class="ctrl pedal">▼ BRAKE</button>
  </div>
  <button id="reset">車をリセット</button>
</div>
<div id="startScreen">
  <div id="card">
    <div class="brand">NEXT GENERATION RACING</div>
    <h1>APEX RACING</h1>
    <p>3Dサーキットを3周しよう。<br>
      左右に傾ける：ハンドル<br>前に傾ける：アクセル<br>
      手前に傾ける：ブレーキ<br>画面のボタンでも運転できます。</p>
    <p id="status">スタートするとレースが始まります。</p>
    <button id="startBtn">START RACE</button>
    <p>スマホを横向きにすると遊びやすくなります。</p>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;

let scene, camera, renderer, car, curve;
let trackLength = 1; // コース作成前に宣言して初期化エラーを防ぐ
let running=false, finished=false, speed=0, progress=0, lateral=0, steer=0;
let lap=1;
const totalLaps=3, roadWidth=17, samples=420, maxSpeed=245;
let startTime=0, lastFrame=performance.now(), elapsed=0, bestLap=null, lapStart=0;
let tiltSteer=0, pitch=0, baseGamma=null, baseBeta=null, sensorEnabled=false;
let left=false, right=false, gas=false, brake=false;

function showError(err){
  const box=$('error');
  box.style.display='block';
  box.textContent='ゲームでエラーが発生しました。\n'+
    (err?.stack||err?.message||String(err))+
    '\n\nインターネット接続とThree.js CDNへのアクセスを確認してください。';
}
window.addEventListener('error',e=>showError(e.error||e.message));
window.addEventListener('unhandledrejection',e=>showError(e.reason));

try { init(); requestAnimationFrame(animate); }
catch(e){ showError(e); }

function mat(color,roughness=.8,metalness=0){
  return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x9ebbd0);
  scene.fog=new THREE.Fog(0x9ebbd0,150,450);
  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,900);
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  $('game').appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xe5f4ff,0x3d5435,2));
  const sun=new THREE.DirectionalLight(0xfff0d5,3);
  sun.position.set(-80,120,60);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  scene.add(sun);

  makeWorld();
  makeTrack();
  makeCar();
  bindControls();
  $('startBtn').addEventListener('click',startRace);
  $('reset').addEventListener('click',resetCar);
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  });
}

function makeWorld(){
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),mat(0x416d40));
  ground.rotation.x=-Math.PI/2; ground.position.y=-.15; ground.receiveShadow=true; scene.add(ground);
  const hillMat=mat(0x718b70);
  for(let i=0;i<28;i++){
    const a=i/28*Math.PI*2, r=230+(i%4)*20;
    const hill=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),hillMat);
    hill.scale.set(45,25+(i%5)*6,48);
    hill.position.set(Math.cos(a)*r,12,Math.sin(a)*r); scene.add(hill);
  }
  const trunkMat=mat(0x54361e), leavesMat=mat(0x315c37);
  for(let i=0;i<80;i++){
    const a=Math.random()*Math.PI*2, r=125+Math.random()*100;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.35,2.8,6),trunkMat);
    trunk.position.set(x,1.3,z);
    const leaves=new THREE.Mesh(new THREE.ConeGeometry(2.3,6,7),leavesMat);
    leaves.position.set(x,4.8,z); scene.add(trunk,leaves);
  }
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+.25, stand=new THREE.Group();
    const base=new THREE.Mesh(new THREE.BoxGeometry(25,4,9),mat(0x65717c));
    base.position.y=2; stand.add(base);
    for(let row=0;row<4;row++){
      const seats=new THREE.Mesh(new THREE.BoxGeometry(23,.4,1.2),mat(row%2?0x244b70:0xb83d37));
      seats.position.set(0,3.5+row*.6,-2+row); stand.add(seats);
    }
    stand.position.set(Math.cos(a)*135,0,Math.sin(a)*105);
    stand.rotation.y=-a; scene.add(stand);
  }
}

function makeTrack(){
  const pts=[[0,0],[38,0],[75,-8],[96,-28],[96,-52],[77,-74],[40,-82],[0,-78],[-39,-68],[-73,-48],[-91,-21],[-86,9],[-65,33],[-32,47],[5,48],[35,35],[45,15],[32,1]]
    .map(p=>new THREE.Vector3(p[0],0,p[1]));
  curve=new THREE.CatmullRomCurve3(pts,true,'catmullrom',.15);
  trackLength=curve.getLength(); // curve生成後に長さを代入

  const roadMat=mat(0x34383c,.96), white=mat(0xf1f0e8), red=mat(0xd93632), railMat=mat(0xa9b5be,.5,.55);
  const positions=[], indices=[];
  for(let i=0;i<=samples;i++){
    const p=curve.getPointAt(i/samples), t=curve.getTangentAt(i/samples).normalize();
    for(const w of [-roadWidth/2,roadWidth/2]) positions.push(p.x-t.z*w,.015,p.z+t.x*w);
    if(i<samples){const k=i*2; indices.push(k,k+1,k+2,k+1,k+3,k+2);}
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geo.setIndex(indices); geo.computeVertexNormals();
  const road=new THREE.Mesh(geo,roadMat); road.receiveShadow=true; scene.add(road);

  for(let i=0;i<samples;i++){
    const t=i/samples, p=curve.getPointAt(t), tan=curve.getTangentAt(t).normalize();
    const yaw=Math.atan2(tan.x,tan.z);
    for(const side of [-1,1]){
      const curb=new THREE.Mesh(new THREE.BoxGeometry(1,.14,1.1),Math.floor(i/3)%2?red:white);
      curb.position.set(p.x-tan.z*(roadWidth/2+.5)*side,.08,p.z+tan.x*(roadWidth/2+.5)*side);
      curb.rotation.y=yaw; scene.add(curb);
      if(i%2===0){
        const rail=new THREE.Mesh(new THREE.BoxGeometry(.25,.7,2.3),railMat);
        rail.position.set(p.x-tan.z*(roadWidth/2+2)*side,.8,p.z+tan.x*(roadWidth/2+2)*side);
        rail.rotation.y=yaw; scene.add(rail);
      }
    }
    if(i%5<2){
      const dash=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,1.3),white);
      dash.position.set(p.x,.055,p.z); dash.rotation.y=yaw; scene.add(dash);
    }
  }
  const start=curve.getPointAt(0), tan=curve.getTangentAt(0).normalize();
  for(let i=0;i<18;i++){
    const tile=new THREE.Mesh(new THREE.BoxGeometry(roadWidth/18,.035,1.2),i%2?white:mat(0x161719));
    tile.position.set(start.x+(i-8.5)*roadWidth/18,.08,start.z);
    tile.rotation.y=Math.atan2(tan.x,tan.z); scene.add(tile);
  }
}

function makeCar(){
  car=new THREE.Group();
  const paint=new THREE.MeshPhysicalMaterial({color:0xd51f2a,metalness:.6,roughness:.25,clearcoat:1});
  const black=mat(0x111419,.45,.25);
  const glass=new THREE.MeshPhysicalMaterial({color:0x172c3a,roughness:.12,metalness:.3,clearcoat:1});
  const rubber=mat(0x101113,1), rim=mat(0xb0bac3,.25,.8);
  const light=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xabcfff,emissiveIntensity:1});
  const tail=new THREE.MeshStandardMaterial({color:0xff1827,emissive:0xb50010,emissiveIntensity:1.3});
  function box(w,h,d,m,x,y,z){
    const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
    o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; car.add(o); return o;
  }
  box(2.05,.48,4.3,paint,0,.7,0);
  box(1.65,.18,1.35,paint,0,.96,1.15);
  box(1.5,.15,.7,paint,0,.92,-1.75);
  box(1.4,.58,1.75,glass,0,1.18,-.15);
  box(1.55,.08,1.9,black,0,1.48,-.15);
  box(2.15,.12,.4,black,0,.46,2.1);
  box(2,.12,.35,black,0,1.42,-1.95);
  box(.12,.35,.12,black,-.7,1.24,-1.85);
  box(.12,.35,.12,black,.7,1.24,-1.85);
  box(.4,.12,.08,light,-.72,.83,2.16);
  box(.4,.12,.08,light,.72,.83,2.16);
  box(.45,.12,.08,tail,-.65,.83,-2.17);
  box(.45,.12,.08,tail,.65,.83,-2.17);
  for(const x of [-1.02,1.02]) for(const z of [-1.4,1.4]){
    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.41,.41,.28,20),rubber);
    wheel.rotation.z=Math.PI/2; wheel.position.set(x,.46,z); wheel.castShadow=true; car.add(wheel);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.3,16),rim);
    hub.rotation.z=Math.PI/2; hub.position.set(x,.46,z); car.add(hub);
  }
  car.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  scene.add(car); placeCar(0,0);
}

function placeCar(t,offset){
  const u=((t%1)+1)%1, p=curve.getPointAt(u), tan=curve.getTangentAt(u).normalize();
  car.position.set(p.x-tan.z*offset,.02,p.z+tan.x*offset);
  car.rotation.y=Math.atan2(tan.x,tan.z);
}

function bindButton(id,callback){
  const el=$(id);
  const down=e=>{e.preventDefault();callback(true);el.classList.add('active');};
  const up=e=>{e.preventDefault();callback(false);el.classList.remove('active');};
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function bindControls(){
  bindButton('left',v=>left=v);
  bindButton('right',v=>right=v);
  bindButton('gas',v=>gas=v);
  bindButton('brake',v=>brake=v);
}

function startRace(){
  if(running)return;
  running=true; finished=false; speed=0; progress=0; lateral=0; steer=0; lap=1; elapsed=0; lapStart=0; bestLap=null;
  startTime=performance.now(); lastFrame=startTime;
  $('startScreen').style.display='none';
  $('message').textContent='GO!';
  $('lap').textContent='LAP 1 / '+totalLaps;
  $('engine').textContent='RUN';
  $('time').textContent='00:00.000';
  $('best').textContent='--:--.---';
  placeCar(0,0);
  setupSensors();
  setTimeout(()=>{if(running&&!finished)$('message').textContent='';},1200);
}

async function setupSensors(){
  try{
    if(!('DeviceOrientationEvent' in window)){
      $('status').textContent='画面ボタンで操作できます。'; return;
    }
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const permission=await DeviceOrientationEvent.requestPermission();
      if(permission!=='granted'){
        $('status').textContent='画面ボタンで操作できます。'; return;
      }
    }
    window.addEventListener('deviceorientation',onOrientation,true);
    sensorEnabled=true;
    $('status').textContent='傾きセンサーが有効です。';
  }catch(e){
    sensorEnabled=false;
    $('status').textContent='センサー未使用。画面ボタンで操作できます。';
  }
}

function onOrientation(e){
  if(e.gamma==null||e.beta==null)return;
  if(baseGamma===null){baseGamma=e.gamma;baseBeta=e.beta;}
  tiltSteer=clamp((e.gamma-baseGamma)/24,-1,1);
  pitch=clamp((e.beta-baseBeta)/18,-1,1);
}

function resetCar(){
  speed=0; lateral=0; steer=0;
  if(curve&&car)placeCar(progress%1,0);
}

function formatTime(s){
  const m=Math.floor(s/60), sec=Math.floor(s%60), ms=Math.floor((s%1)*1000);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+String(ms).padStart(3,'0');
}

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastFrame)/1000,.05);
  lastFrame=now;
  if(running&&!finished)update(dt,now);
  if(car&&curve)updateCamera(dt);
  if(renderer)renderer.render(scene,camera);
}

function update(dt,now){
  const manual=(right?1:0)-(left?1:0);
  const input=clamp(manual+(sensorEnabled?tiltSteer:0),-1,1);
  steer=lerp(steer,input,Math.min(1,dt*5));
  let throttle=gas?1:0, braking=brake?1:0;
  if(sensorEnabled){if(pitch>.32)throttle=1;if(pitch<-.32)braking=1;}
  if(throttle)speed+=65*dt; else speed-=12*dt;
  if(braking)speed-=110*dt;
  speed=clamp(speed,0,maxSpeed);

  progress+=(speed/3.6*dt)/trackLength;
  const t=progress%1, p=curve.getPointAt(t), tan=curve.getTangentAt(t).normalize();
  lateral+=steer*(.45+speed/100)*dt*3.6;
  lateral*=Math.pow(.998,dt*60);
  lateral=clamp(lateral,-roadWidth*.95,roadWidth*.95);

  const offRoad=Math.abs(lateral)>roadWidth*.4;
  if(offRoad)speed=Math.max(0,speed-28*dt);

  car.position.set(p.x-tan.z*lateral,.02,p.z+tan.x*lateral);
  car.rotation.y=Math.atan2(tan.x,tan.z)-steer*.12*(speed/100);
  car.rotation.z=clamp(-steer*.045,-.06,.06);
  car.rotation.x=braking?-.02:(throttle?.01:0);

  elapsed=(now-startTime)/1000;
  $('time').textContent=formatTime(elapsed);
  $('speed').textContent=String(Math.round(speed)).padStart(3,'0');
  $('engine').textContent=offRoad?'OFF ROAD':braking?'BRAKE':throttle?'ACCEL':'CRUISE';

  const completed=Math.floor(progress);
  if(completed>=lap){
    const lapTime=elapsed-lapStart;
    if(bestLap===null||lapTime<bestLap)bestLap=lapTime;
    lapStart=elapsed; lap++;
    $('best').textContent=formatTime(bestLap);
    if(lap>totalLaps){
      finished=true; running=false;
      $('message').textContent='RACE COMPLETE!';
      $('engine').textContent='FINISH';
    }else{
      $('message').textContent='LAP '+lap;
      setTimeout(()=>{if(running&&!finished)$('message').textContent='';},900);
    }
    $('lap').textContent='LAP '+Math.min(lap,totalLaps)+' / '+totalLaps;
  }
  if(offRoad){$('message').style.color='#ff8b62';$('message').textContent='OFF TRACK';}
  else {
    $('message').style.color='white';
    if($('message').textContent==='OFF TRACK')$('message').textContent='';
  }
  drawMap();
}

function updateCamera(dt){
  const forward=new THREE.Vector3(0,0,1).applyQuaternion(car.quaternion);
  const target=car.position.clone().addScaledVector(forward,-10-speed*.018);
  target.y=4.1+speed*.012;
  camera.position.lerp(target,Math.min(1,dt*3.5));
  const look=car.position.clone().addScaledVector(forward,8);
  look.y=1.3; camera.lookAt(look);
}

function drawMap(){
  const c=$('map'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='#101820';ctx.fillRect(0,0,c.width,c.height);
  const pts=[];
  for(let i=0;i<=120;i++)pts.push(curve.getPointAt(i/120));
  const xs=pts.map(p=>p.x), zs=pts.map(p=>p.z);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minZ=Math.min(...zs), maxZ=Math.max(...zs);
  const scale=Math.min((c.width-30)/(maxX-minX),(c.height-25)/(maxZ-minZ));
  const ox=(c.width-(maxX-minX)*scale)/2, oy=(c.height-(maxZ-minZ)*scale)/2;
  ctx.beginPath();
  pts.forEach((p,i)=>{
    const x=ox+(p.x-minX)*scale, y=oy+(p.z-minZ)*scale;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.closePath();ctx.strokeStyle='#e7ebef';ctx.lineWidth=8;ctx.stroke();
  ctx.strokeStyle='#454e58';ctx.lineWidth=5;ctx.stroke();
  const p=curve.getPointAt(progress%1);
  ctx.fillStyle='#ffd052';ctx.beginPath();
  ctx.arc(ox+(p.x-minX)*scale,oy+(p.z-minZ)*scale,5,0,Math.PI*2);ctx.fill();
}
</script>
</body>
</html>
